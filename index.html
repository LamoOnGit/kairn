<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
/* Plan : outil de pilotage dense. Barre latérale encre, zone de travail claire ; la couleur sert l'état (retard, priorité, projet), l'accent cobalt sert l'action. Les OP ont des bannières pleines à la couleur de leur projet. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#eceef4; --ink:#151927; --muted:#5b6276; --faint:#9aa0b2; --line:#dde0e9;
  --accent:#2f54eb; --accent-ink:#ffffff; --accent-soft:#e5eaff;
  --danger:#d32f2f; --danger-soft:#fdeaea; --orange:#e8590c; --orange-soft:#fff0e6; --warn:#b97800; --warn-soft:#fff4da; --ok:#1d8a4b; --ok-soft:#e2f4e8; --violet:#7c4dda; --violet-soft:#f0e9ff;
  --side-bg:#131725; --side-ink:#e6e8f1; --side-muted:#8b91a8; --side-hover:#1f2437;
  --wk:rgba(20,25,40,.035);
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e111a; --surface:#161a26; --surface-2:#1d2231; --ink:#e8eaf2; --muted:#9ba1b6; --faint:#666d84; --line:#272d3e;
    --accent:#6f8bff; --accent-ink:#0b0f1c; --accent-soft:#1f2a52;
    --danger:#ff6b6b; --danger-soft:#3a1a1e; --orange:#ff8f4d; --orange-soft:#3a2416; --warn:#f0b43c; --warn-soft:#352a12; --ok:#4cc982; --ok-soft:#14301f; --violet:#ae8bff; --violet-soft:#2a2045;
    --side-bg:#0a0d15; --side-hover:#171c2b; --wk:rgba(255,255,255,.025);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e111a; --surface:#161a26; --surface-2:#1d2231; --ink:#e8eaf2; --muted:#9ba1b6; --faint:#666d84; --line:#272d3e;
  --accent:#6f8bff; --accent-ink:#0b0f1c; --accent-soft:#1f2a52;
  --danger:#ff6b6b; --danger-soft:#3a1a1e; --orange:#ff8f4d; --orange-soft:#3a2416; --warn:#f0b43c; --warn-soft:#352a12; --ok:#4cc982; --ok-soft:#14301f; --violet:#ae8bff; --violet-soft:#2a2045;
  --side-bg:#0a0d15; --side-hover:#171c2b; --wk:rgba(255,255,255,.025);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.side{background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;gap:20px;padding:18px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font:700 13px var(--font-mono);color:#fff}
.brand b{font:700 18px var(--font-display)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--side-muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-hover);color:var(--side-ink)}
.nav a.on{background:var(--side-hover);color:var(--side-ink);box-shadow:inset 3px 0 0 var(--accent)}
.nav .n{margin-left:auto;font:500 12px var(--font-mono);color:var(--side-muted)}
.nav .n.alert{color:#ff8a8a}
.side h3{font:600 11px var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);padding:0 10px;margin-bottom:6px;display:flex;align-items:center}
.side h3 button{margin-left:auto;background:none;border:0;color:var(--side-muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.side h3 button:hover{color:var(--side-ink)}
.plist{display:flex;flex-direction:column;gap:1px}
.plist button{all:unset;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:var(--side-ink);cursor:pointer;font-size:14px}
.plist button:hover,.plist button.on{background:var(--side-hover)}
.plist button:focus-visible{outline:2px solid var(--accent)}
.plist .dot{width:9px;height:9px;border-radius:3px;background:var(--pc);flex:none}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .n{margin-left:auto;font:500 12px var(--font-mono);color:var(--side-muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot button{all:unset;cursor:pointer;padding:7px 10px;border-radius:8px;color:var(--side-muted);font-size:14px}
.side-foot button:hover{background:var(--side-hover);color:var(--side-ink)}
.acct{display:flex;flex-direction:column;gap:2px;padding:0 0 4px}
.acct-mail{padding:0 10px;font-size:12px;color:var(--side-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{padding:4px 10px;font-size:12px;color:var(--side-muted);display:flex;gap:8px;align-items:center}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--side-muted);flex:none}
.sync-dot.cloud{background:#4cc982}.sync-dot.local{background:#f0b43c}

.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.top h1{font-size:22px;margin-right:auto}
.search{position:relative}
.search input{width:220px;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
#view{flex:1;overflow-y:auto;padding:20px 24px 48px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger-ghost{background:transparent;color:var(--danger);border-color:transparent}
.btn.danger-ghost:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;border-radius:6px}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* pastilles */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.prio-critical{color:var(--danger);background:var(--danger-soft)}
.prio-urgent{color:var(--orange);background:var(--orange-soft)}
.prio-important{color:var(--warn);background:var(--warn-soft)}
.prio-normal{color:var(--muted);background:var(--surface-2)}
.prio-low{color:var(--faint);background:var(--surface-2)}
.st{border-radius:6px}
.st::before{border-radius:2px}
.st-todo{color:var(--muted);background:var(--surface-2)}
.st-doing{color:var(--accent);background:var(--accent-soft)}
.st-waiting{color:var(--warn);background:var(--warn-soft)}
.st-review{color:var(--violet);background:var(--violet-soft)}
.st-done{color:var(--ok);background:var(--ok-soft)}
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.pchip::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--pc);flex:none}
.due{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.due.late{color:var(--danger)}
.due.soon{color:var(--orange)}
.tid{font:500 12px var(--font-mono);color:var(--faint);white-space:nowrap}
.tag{font:500 11px var(--font-mono);color:var(--muted);background:var(--surface-2);padding:1px 6px;border-radius:4px;white-space:nowrap}
.blocked{font:600 11px var(--font-body);color:var(--danger);background:var(--danger-soft);padding:1px 6px;border-radius:4px;white-space:nowrap}
.etype{font:600 10px var(--font-mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.etype.t-op{background:var(--accent-soft);color:var(--accent)}
.etype.t-flash{background:var(--warn-soft);color:var(--warn)}
.swatches label.auto span{display:grid;place-items:center;font:700 10px var(--font-body);color:#fff;width:auto;padding:0 8px}
.etype.t-deadline{background:var(--danger-soft);color:var(--danger)}
.etype.t-meeting{background:var(--violet-soft);color:var(--violet)}
.etype.t-absence{background:var(--warn-soft);color:var(--warn)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 10px;min-width:0}
.panel h2{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.panel h2 small{font:500 12px var(--font-mono);color:var(--faint)}
.panel h2 .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.link{font:600 13px var(--font-body);color:var(--accent);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.empty-line{color:var(--faint);font-size:14px;padding:8px 0 12px}

/* rangées de tâches */
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 10px;padding:7px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.trow:first-child{border-top:0}
.trow:hover{background:var(--surface-2)}
.trow .ttl{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .meta{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.trow.is-done .ttl{text-decoration:line-through;color:var(--faint)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:12px;height:12px}

/* tableau de bord */
.dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dhead .date{font:600 15px var(--font-body);text-transform:capitalize;margin-right:8px}
.kchip{all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.kchip b{font:700 15px var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.kchip:hover{border-color:var(--faint)}
.kchip:focus-visible{outline:2px solid var(--accent)}
.kchip.alert{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.kchip.alert b{color:var(--danger)}
.d-top{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;margin-bottom:22px;align-items:start}
.section-h{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.section-h h2{font-size:20px}
.section-h small{font:500 12px var(--font-mono);color:var(--faint)}
.section-h .r{margin-left:auto;display:flex;gap:8px}

/* calendrier */
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cal-head h2,.cal-head h3{font-size:18px;text-transform:capitalize;margin-right:6px;min-width:150px}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--line);gap:1px}
.cal.big{min-width:700px}
.cal .dow{background:var(--surface-2);padding:5px 7px;font:600 11px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cell{background:var(--surface);min-height:108px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal.compact .cell{min-height:74px;gap:2px}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--bg)}
.cell.out .dn{color:var(--faint)}
.cell.wknd:not(.out){background:color-mix(in srgb,var(--surface) 75%,var(--surface-2))}
.cell .dn{font:500 12px var(--font-mono);color:var(--muted);align-self:flex-start;padding:1px 5px;border-radius:5px}
.cell.today .dn{background:var(--accent);color:var(--accent-ink)}
.chip{all:unset;display:block;font-size:12px;padding:1px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.45;min-width:0}
.cal.compact .chip{font-size:11px}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip.ev{background:color-mix(in srgb,var(--pc) 20%,var(--surface));color:var(--ink);font-weight:600;border-left:3px solid var(--pc)}
.chip.ev.op{background:var(--pc);color:#fff;border-left-color:transparent}
.chip.tk{background:var(--surface-2);color:var(--ink)}
.chip.evs{background:transparent;color:var(--ink);font-weight:500;padding-left:2px}
.chip.evs::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:5px;vertical-align:1px;background:var(--pc)}
.chip.evs:hover{background:var(--surface-2)}
.tl-dot{position:absolute;top:12px;width:10px;height:10px;border-radius:2px;transform:rotate(45deg);background:var(--pc);border:0;padding:0;cursor:pointer}
.tl-dot:focus-visible{outline:2px solid var(--accent)}
.chip.ev.ext,.tl-bar.ext{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--pc) 38%,var(--surface)) 0 6px,color-mix(in srgb,var(--pc) 16%,var(--surface)) 6px 12px);color:var(--ink);border-left:3px dashed var(--pc)}
.wev .bar.ext{background:repeating-linear-gradient(180deg,var(--pc) 0 4px,transparent 4px 7px)}
.ext-tag{font:600 10px var(--font-mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;border:1px dashed currentColor;color:var(--muted);white-space:nowrap}
.seg-yn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-yn label{position:relative}
.seg-yn input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg-yn span{display:block;padding:6px 16px;font-size:14px;font-weight:600;cursor:pointer}
.seg-yn input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg-yn input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.ext-box{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.chip.tk::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--dc,var(--faint))}
.chip.tk.done{color:var(--faint);text-decoration:line-through}
.chip.tk.late{color:var(--danger)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}

/* semaine */
.d-top>.panel{display:flex;flex-direction:column;align-self:stretch}
.week{display:flex;flex-direction:column;gap:2px;flex:1 1 0;min-height:420px;overflow-y:auto;contain:size}
.trow.stack{grid-template-columns:auto minmax(0,1fr)}
.trow.stack .ttl{white-space:normal}
.trow.stack .meta{grid-column:2;justify-content:flex-start}
.wday{padding:8px 0 4px}
.wday h4{margin:0 0 4px;font:600 12px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center}
.wday h4 .dd{font-family:var(--font-mono);font-weight:500;text-transform:none;letter-spacing:0;color:var(--faint)}
.wday.is-today h4{color:var(--accent)}
.wday.late h4{color:var(--danger)}
.wday .none{font-size:13px;color:var(--faint);padding:2px 6px}
.wev{display:flex;gap:10px;align-items:center;padding:6px;border-radius:6px;cursor:pointer;font-size:14px}
.wev:hover{background:var(--surface-2)}
.wev .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--pc)}
.wev .tm{font:500 12px var(--font-mono);color:var(--muted);min-width:44px}
.wev .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bannières */
.banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:24px}
.op-banner{all:unset;box-sizing:border-box;cursor:pointer;border-radius:14px;padding:18px 20px;color:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center;min-height:150px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--pc) 0%,color-mix(in srgb,var(--pc) 72%,#0b0e18) 100%)}
.op-banner:hover{filter:brightness(1.05)}
.op-banner:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.op-banner .cd{grid-row:1/4;text-align:center;min-width:84px}
.op-banner .cd b{display:block;font:800 46px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.op-banner .cd span{font:500 11px var(--font-mono);text-transform:uppercase;opacity:.85}
.op-banner .ttl{font:700 21px/1.15 var(--font-display);text-wrap:balance}
.op-banner .sub{font-size:13px;opacity:.9;display:flex;gap:10px;flex-wrap:wrap}
.op-banner .prep{grid-column:2;display:flex;flex-direction:column;gap:5px;font-size:12px}
.op-banner .prep .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.op-banner .prep .bar i{display:block;height:100%;background:#fff;border-radius:3px}
.op-banner .live{position:absolute;top:12px;right:14px;font:700 11px var(--font-mono);background:rgba(255,255,255,.22);padding:2px 8px;border-radius:999px;text-transform:uppercase}
.due-banner{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--uc,var(--faint));border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:132px}
.due-banner:hover{border-color:var(--faint);border-left-color:var(--uc)}
.due-banner:focus-visible{outline:2px solid var(--accent)}
.due-banner .when{font:800 24px/1 var(--font-display);color:var(--uc)}
.due-banner .when small{font:500 12px var(--font-mono);color:var(--muted);margin-left:8px}
.due-banner .ttl{font-weight:600;font-size:16px;line-height:1.3}
.due-banner .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto}
.dash-empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}

.prog{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:12px;align-items:center;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.prog:first-child{border-top:0}
.prog:hover{background:var(--surface-2)}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pc,var(--accent));border-radius:3px}
.prog .pct{font:500 12px var(--font-mono);color:var(--muted);text-align:right}
.pname{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;min-width:0}
.pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));column-gap:24px}

/* barre d'outils */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.cal-head select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.toolbar .count{margin-left:auto;font:500 12px var(--font-mono);color:var(--muted)}
.chipbtn{border:1px dashed var(--faint);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}

/* table */
.table{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.thead,.table .trow{display:grid;grid-template-columns:28px 56px minmax(220px,1fr) 150px 140px 150px 132px 32px;gap:10px;align-items:center;min-width:960px}
.thead{padding:8px 14px;border-bottom:1px solid var(--line);font:600 11px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.table .trow{padding:6px 14px;border-radius:0}
.table .trow .ttl{display:flex;gap:8px;align-items:center}
.table .trow .ttl>span:first-child{overflow:hidden;text-overflow:ellipsis}
.group-h{padding:10px 14px 6px;font:700 14px var(--font-display);display:flex;gap:8px;align-items:center;background:var(--surface-2);border-top:1px solid var(--line);min-width:960px}
.group-h .n{font:500 12px var(--font-mono);color:var(--muted)}
.isel{border:1px solid transparent;border-radius:6px;padding:3px 6px;font-size:13px;font-weight:600;background:transparent;cursor:pointer;width:100%}
.isel:hover{border-color:var(--line)}
.isel.st-todo,.isel.st-doing,.isel.st-waiting,.isel.st-review,.isel.st-done,.isel.prio-critical,.isel.prio-urgent,.isel.prio-important,.isel.prio-normal,.isel.prio-low{border-color:transparent}
.idate{border:1px solid transparent;border-radius:6px;padding:3px 6px;font:500 12px var(--font-mono);background:transparent;width:100%;color:var(--muted)}
.idate:hover{border-color:var(--line)}
.idate.late{color:var(--danger)}

/* kanban */
.kb-wrap{overflow-x:auto;padding-bottom:8px}
.kb{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:12px;min-width:1240px}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:300px;border:2px solid transparent}
.kcol.over{border-color:var(--accent)}
.kcol header{display:flex;align-items:center;gap:8px;padding:2px 4px 6px}
.kcol header .n{font:500 12px var(--font-mono);color:var(--muted)}
.kcol header button{margin-left:auto}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;display:flex;flex-direction:column;gap:8px}
.kcard:hover{border-color:var(--faint)}
.kcard.dragging{opacity:.4}
.kcard .ttl{font-weight:500;line-height:1.35}
.kcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kcard .row .due{margin-left:auto}
.kcard.p-critical{box-shadow:inset 3px 0 0 var(--danger)}
.kcard.p-urgent{box-shadow:inset 3px 0 0 var(--orange)}
.kcard.p-important{box-shadow:inset 3px 0 0 var(--warn)}

/* chronologie */
.tl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100vh - 220px)}
.tl{position:relative;width:max-content}
.tl-row{display:flex;min-height:34px;border-bottom:1px solid var(--line)}
.tl-label{position:sticky;left:0;z-index:2;width:240px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:13px;min-width:0;cursor:pointer}
.tl-label span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-label.group{font:700 14px var(--font-display);cursor:default;background:var(--surface-2)}
.tl-row.group{background:var(--surface-2)}
.tl-track{position:relative;flex:none}
.tl-head{position:sticky;top:0;z-index:3;background:var(--surface)}
.tl-head .tl-label{z-index:4;font:600 11px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:default}
.tl-days{display:flex}
.tl-days div{flex:none;text-align:center;font:500 11px var(--font-mono);color:var(--muted);padding:3px 0;border-left:1px solid var(--line)}
.tl-days div.today{color:var(--accent-ink);background:var(--accent)}
.tl-days div.mon{color:var(--ink)}
.tl-months{display:flex}
.tl-months div{flex:none;font:600 12px var(--font-body);padding:4px 6px;text-transform:capitalize;border-left:1px solid var(--line);overflow:hidden;white-space:nowrap}
.tl-bar{position:absolute;top:6px;height:22px;border-radius:6px;background:var(--pc);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left}
.tl-bar.task{background:color-mix(in srgb,var(--pc) 75%,var(--surface));}
.tl-bar.done{opacity:.4}
.tl-bar.late{box-shadow:0 0 0 2px var(--danger)}
.tl-bar.ms{width:16px!important;height:16px;top:9px;transform:rotate(45deg);border-radius:3px;padding:0}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:1;pointer-events:none;opacity:.7}

/* événements */
.evlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev-month{padding:10px 16px 6px;font:700 15px var(--font-display);text-transform:capitalize;background:var(--surface-2);border-top:1px solid var(--line)}
.ev-month:first-child{border-top:0}
.evrow{display:grid;grid-template-columns:6px 150px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.evrow:hover{background:var(--surface-2)}
.evrow .sw{width:6px;align-self:stretch;border-radius:3px;background:var(--pc)}
.evrow .dt{font:500 12px var(--font-mono);color:var(--muted)}
.evrow .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evrow .side-meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.evrow.past{opacity:.55}

/* projets */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--pc)}
.pcard h3{font-size:18px}
.pcard p{margin:0;color:var(--muted);font-size:14px}
.pcard .stats{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pcard .stats b{font:600 15px var(--font-mono);color:var(--ink)}
.pcard .acts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.pcard.add{border:2px dashed var(--line);align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-weight:600;min-height:180px;background:transparent}
.pcard.add:hover{border-color:var(--accent);color:var(--accent)}

.note{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);flex-wrap:wrap}
.note.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.note .btn{margin-left:auto}
.welcome{max-width:640px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px;display:flex;flex-direction:column;gap:14px}
.welcome h2{font-size:26px}
.welcome p{margin:0;color:var(--muted)}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.loader{display:grid;place-items:center;height:60%;color:var(--muted)}

/* modales */
#modal-root[hidden],#drawer-root[hidden]{display:none}
.backdrop{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:30}
.modal{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 24px));max-height:calc(100% - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.small{width:min(440px,calc(100% - 24px))}
.modal.wide{width:min(960px,calc(100% - 24px))}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:18px;margin-right:auto;text-transform:none}
.m-body{padding:18px 20px;overflow-y:auto}
.modal footer{display:flex;gap:8px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.spacer{flex:1}
.form{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;border:0;padding:0;margin:0;min-width:0}
.field>span,.field>.lbl-l,.field legend,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0}
.field input,.field select,.field textarea,.add-line input,.inp{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus,.add-line input:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.inline-check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.inline-check input{width:16px;height:16px;accent-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0}
.swatches span{display:block;width:28px;height:28px;border-radius:8px;background:var(--pc);cursor:pointer;border:3px solid transparent}
.swatches input:checked+span{border-color:var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checklist{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:2px}
.checklist li{display:flex;align-items:center;gap:10px;padding:4px 2px}
.checklist li span{flex:1}
.checklist li.done span{text-decoration:line-through;color:var(--faint)}
.checklist li .icon-btn{font-size:16px}
.add-line{display:flex;gap:8px}
.hint{font-size:13px;color:var(--muted);margin:0}
.mini-list{display:flex;flex-direction:column}

/* panneau tâche */
.drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.18);display:flex;flex-direction:column}
#drawer-root .backdrop{z-index:20;background:rgba(10,12,20,.25)}
.dr-top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.dr-top select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);font-size:13px;max-width:220px}
.dr-body{flex:1;overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px}
.dr-title{font:700 22px/1.25 var(--font-display);border:1px solid transparent;border-radius:8px;padding:4px 6px;margin:0 -6px;width:calc(100% + 12px);background:transparent;resize:none}
.dr-title:hover{border-color:var(--line)}
.dr-title:focus{outline:2px solid var(--accent);border-color:transparent}
.dr-fields{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;align-items:center;font-size:14px}
.dr-fields>label,.dr-fields>.k{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dr-fields select,.dr-fields input{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;max-width:300px}
.dr-fields .dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr-fields .dates input{width:160px}
.deps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dep{display:inline-flex;gap:6px;align-items:center;font-size:13px;background:var(--surface-2);padding:2px 4px 2px 8px;border-radius:6px}
.dep.ok{color:var(--faint);text-decoration:line-through}
.dep button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;padding:0 4px}
.dr-sec h4{margin:0 0 6px;font:600 12px var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dr-sec textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical;min-height:90px}
.activity{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.act{font-size:14px;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.act.sys{background:transparent;padding:2px 10px;font-size:12px;color:var(--muted);flex-direction:row;gap:8px}
.act time{font:500 11px var(--font-mono);color:var(--faint)}
.act p{margin:0;white-space:pre-wrap}

/* import */
.imp-src{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.imp-src textarea{width:100%;min-height:120px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:13px var(--font-mono);resize:vertical}
.imp-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.imp-wrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.imp-table th{position:sticky;top:0;background:var(--surface-2);text-align:left;font:600 11px var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:7px 8px}
.imp-table td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.imp-table td.bad{color:var(--danger)}
.imp-table td.dup{color:var(--warn)}
.imp-table .mono{font-family:var(--font-mono);font-size:12px;white-space:nowrap}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}

.mrow{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:14px}
.mrow:hover{background:var(--surface-2)}
.mrow .pdot{width:7px;height:7px;border-radius:50%;flex:none}
.mrow .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .check{width:18px;height:18px}
.more-link{font-size:12px;padding:2px 6px}
.tcount{display:inline-flex;align-items:baseline;gap:3px;font:700 12px/1 var(--font-body);color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:999px;white-space:nowrap}
.tcount small{font-size:10px;font-weight:600}
.dhead2 .sp{flex:1}
.tcount.late{color:var(--danger);background:var(--danger-soft)}

.cell .dn{display:inline-flex;align-items:center}
.chip.ev.dl{background:var(--danger-soft);color:var(--danger);border-left:3px solid var(--danger)}
.legend .lg{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0;background:var(--accent)}
.legend .lg.ext{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,var(--accent-soft) 3px 6px)}
.legend .lg.dl{background:var(--danger)}
.banners.b3{grid-template-columns:repeat(3,minmax(0,1fr))}
.banners.b4{grid-template-columns:repeat(4,minmax(0,1fr))}
.op-banner{min-height:118px;grid-template-columns:auto minmax(0,1fr)}
.op-banner .cd b{font-size:34px}
.op-banner .prep{flex-direction:row;align-items:center;gap:10px}
.op-banner .prep .bar{flex:1}
.due-banner{min-height:104px}
.due-banner .when{font-size:20px}
@media (max-width:1100px){.banners.b3,.banners.b4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.banners.b3,.banners.b4{grid-template-columns:1fr}}
.cal-switch{display:flex;align-items:center;gap:4px;margin:-4px 0 10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.cal-switch .icon-btn{font-size:20px;padding:2px 8px;flex:none}
.cal-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
.cal-tabs::-webkit-scrollbar{display:none}
.cal-tab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.cal-tab:hover{background:var(--surface-2);color:var(--ink)}
.cal-tab:focus-visible{outline:2px solid var(--accent)}
.cal-tab .dot{width:8px;height:8px;border-radius:3px;background:var(--pc)}
.cal-tab.on{background:var(--ink);color:var(--bg)}
.cal-tab.on[style]{background:var(--pc);color:#fff}
.cal-tab.on .dot{background:#fff}
.cal-slide{overflow:hidden}
.cal-slide.from-right>.cal{animation:calInR .22s ease-out}
.cal-slide.from-left>.cal{animation:calInL .22s ease-out}
@keyframes calInR{from{opacity:.2;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes calInL{from{opacity:.2;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cal-slide>.cal{animation:none!important}}
.dhead2{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:wrap}
.mails{display:inline-flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.mailb{all:unset;box-sizing:border-box;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;font:700 10px/1 var(--font-mono);color:#fff;background:var(--pc,var(--accent));cursor:pointer;flex:none}
.mailb.k-R{background:var(--surface);color:var(--pc,var(--accent));box-shadow:inset 0 0 0 1.5px var(--pc,var(--accent))}
.mailb.static{cursor:default;vertical-align:-3px}
.mailb:focus-visible{outline:2px solid var(--accent)}
.legend .mailb{--pc:var(--accent)}
.btn .mailb{--pc:var(--accent)}
.mail-list{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.mail-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mail-row .mailb{--pc:var(--accent)}
.field .mail-row select,.field .mail-row input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:auto;flex:none}
.field .mail-row input[type=date]{width:160px}
.field .mail-row input[type=time]{width:110px}
.code-chip{font:600 11px var(--font-mono);background:rgba(255,255,255,.22);padding:1px 6px;border-radius:4px;letter-spacing:.04em}
.code-chip.light{background:var(--surface-2);color:var(--ink)}
.ocl{display:flex;flex-direction:column;gap:4px;margin:6px 0 8px}
.ocl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field .ocl-row input{padding:5px 8px;border:1px solid transparent;border-radius:6px;background:transparent;width:auto}
.field .ocl-row input:hover{border-color:var(--line)}
.field .ocl-row input[data-oclf=text]{flex:1;min-width:180px}
.field .ocl-row input[type=date]{width:150px;flex:none;font:500 12px var(--font-mono);color:var(--muted)}
.ocl-row.done input[data-oclf=text]{text-decoration:line-through;color:var(--faint)}
.ocl-row.late input[type=date]{color:var(--danger)}
.newtype{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;padding:8px;border:1px dashed var(--line);border-radius:8px}
.newtype .inp{width:auto;flex:1;min-width:140px}
.types-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.type-row{display:flex;gap:8px;align-items:center}
.type-row .inp{width:auto}
.type-row input[data-tf=name]{flex:1}
.icon-btn.trash{display:grid;place-items:center;padding:4px;color:var(--faint)}
.icon-btn.trash:hover{color:var(--danger);background:var(--danger-soft)}
.kcard .k-del{margin-left:auto;opacity:0}
.kcard:hover .k-del,.kcard .k-del:focus-visible{opacity:1}
.waiting{font:600 11px var(--font-body);color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:4px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.wait-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr-fields .wait-f input{max-width:340px}
.d-bottom{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.banners.b2{grid-template-columns:repeat(2,minmax(0,1fr))}
.rem-panel{margin-top:42px}
.rem-panel h2{margin-bottom:6px}
.rem-count{font:700 12px var(--font-body);background:var(--orange);color:#fff;border-radius:999px;padding:1px 8px}
.rem-list{display:flex;flex-direction:column}
.rem{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px solid var(--line);font-size:14px}
.rem:first-child{border-top:0}
.rem.later{opacity:.75}

<script>

/* ---------- utilitaires ---------- */

function hexToHsl(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0,S2=0;const L=(mx+mn)/2;if(mx!==mn){const d=mx-mn;S2=L>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60;}return [H,S2*100,L*100];}

const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).catch(()=>{}).then(fn);queues[key]=p.catch(()=>{});return p;}

function writeError(e){
  const code=e&&e.code;
  if(code==='quota_exceeded')toast('Stockage plein : supprime d’anciens éléments.');
  else if(code==='invalid_argument')toast('Enregistrement refusé : tu n’as pas le droit de modifier cette page.');
  else toast('Enregistrement impossible pour le moment, réessaie.');
}
async function save(col,obj){
  obj=clone(obj);obj.updatedAt=Date.now();
  S[col]={...S[col],[obj.id]:obj};schedule();
  if(mode==='supa'){sbWrite(col,obj.id,obj);return;}
  if(mode!=='cloud'){persistLocal();return;}
  const run=()=>refs[col].doc(obj.id).set(obj);
  try{await enqueue(col+'/'+obj.id,run);}
  catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*800));try{await enqueue(col+'/'+obj.id,run);return;}catch(e2){writeError(e2);return;}}
    writeError(e);
  }
}
async function removeItem(col,id){
  const c={...S[col]};delete c[id];S[col]=c;schedule();
  if(mode==='supa'){sbWrite(col,id,null);return;}
  if(mode==='cloud'){try{await enqueue(col+'/'+id,()=>refs[col].doc(id).delete());}catch(e){writeError(e);}}
  else persistLocal();
}

async function sbWrite(col,id,obj){
  const key=col+'/'+id;sbPending++;renderSide();
  try{
    const {error}=await enqueue(key,()=>obj?sb.from(TABLE[col]).upsert({user_id:sbUser.id,id,data:obj,updated_at:new Date().toISOString()},{onConflict:'user_id,id'}):sb.from(TABLE[col]).delete().eq('id',id));
    if(error)throw error;
    sbFailed.delete(key);
  }catch(e){
    sbFailed.set(key,{col,id,obj});
    toast(navigator.onLine?'Enregistrement refusé par Supabase, nouvel essai dans quelques secondes.':'Pas de connexion : la modification sera envoyée dès le retour du réseau.');
  }finally{sbPending--;schedule();}

async function sbRetry(){if(!sb||!sbUser||!sbFailed.size)return;for(const [,f] of [...sbFailed]){await sbWrite(f.col,f.id,f.obj);}}
async function sbLoadAll(){
  const next={};
  for(const c of COLS){
    let rows=[],from=0;
    for(;;){const {data,error}=await sb.from(TABLE[c]).select('id,data').range(from,from+999);if(error)throw error;rows=rows.concat(data);if(data.length<1000)break;from+=1000;}
    next[c]=Object.fromEntries(rows.map(r=>[r.id,r.data]));
  }
  // les modifications pas encore envoyées gardent la priorité
  sbFailed.forEach(f=>{if(f.obj)next[f.col][f.id]=f.obj;else delete next[f.col][f.id];});
  COLS.forEach(c=>S[c]=next[c]);
}

/* ---------- logique métier ---------- */
function nextNum(){return list('tasks').reduce((m,t)=>Math.max(m,t.num||0),0)+1;}
const RECUR={workday:'Chaque jour ouvré',weekly:'Chaque semaine',biweekly:'Toutes les 2 semaines',monthly:'Chaque mois'};
const RECUR_S={workday:'Quotidien',weekly:'Hebdo',biweekly:'2 sem.',monthly:'Mensuel'};
function nextOccur(ds,r){
  if(r==='weekly')return addDays(ds,7);if(r==='biweekly')return addDays(ds,14);
  if(r==='workday'){let n=addDays(ds,1);while([0,6].includes(parse(n).getDay()))n=addDays(n,1);return n;}
  if(r==='monthly'){const d=parse(ds),y=d.getFullYear(),m=d.getMonth()+1,last=new Date(y,m+1,0).getDate();return iso(new Date(y,m,Math.min(d.getDate(),last)));}
  return ds;
}
function spawnNext(o){
  const base=o.due||today();let due=nextOccur(base,o.recur);while(due<today())due=nextOccur(due,o.recur);
  const shift=diff(base,due);
  const n={...clone(o),id:newId(),num:nextNum(),status:'todo',due,start:o.start?addDays(o.start,shift):'',doneAt:null,recurNext:'',waitingFor:'',waitingSince:'',
    checklist:(o.checklist||[]).map(c=>({...c,id:newId(),done:false})),comments:[{id:newId(),sys:true,text:`Créée automatiquement (récurrence : ${RECUR[o.recur]})`,at:Date.now()}],createdAt:Date.now()};
  save('tasks',n);setTimeout(()=>toast(`Prochaine occurrence créée : ${tkey(n)} pour le ${dShort(due)}`),400);return n;
}
function withStatus(t,s){
  const o=clone(t);if(o.status===s)return o;
  o.comments=(o.comments||[]).concat({id:newId(),sys:true,text:`Statut : ${st(o.status).l} → ${st(s).l}`,at:Date.now()}).slice(-120);
  o.status=s;o.doneAt=s==='done'?Date.now():null;
  if(s==='done'&&o.recur&&RECUR[o.recur]&&!o.recurNext&&S.tasks[o.id]){const n=spawnNext(o);o.recurNext=n.id;}
  return o;
}
function parseTemplate(txt){
  const out=[];
  String(txt||'').split('\n').forEach(line=>{
    const m=line.match(/^\s*([JF])\s*([+-]\s*\d+)?\s*\|\s*([^|]+?)\s*(?:\|\s*(.+?)\s*)?$/i);
    if(!m)return;
    const p=norm(m[4]||'normal');
    const prio=/critical|critique|u\s*\+\s*i|urgent\s*&|urgent et/.test(p)?'critical':/urgent/.test(p)?'urgent':/important/.test(p)?'important':/faible|low|basse/.test(p)?'low':'normal';
    out.push({ref:m[1].toUpperCase(),off:m[2]?parseInt(m[2].replace(/\s/g,''),10):0,title:m[3],prio});
  });
  return out;
}
function generateRetro(ev){
  const lines=parseTemplate(template());const T=today();let n=nextNum(),made=0;
  const existing=new Set(list('tasks').filter(t=>t.eventId===ev.id).map(t=>t.tplKey));
  lines.forEach(l=>{
    const key=l.ref+l.off+'|'+norm(l.title);
    if(existing.has(key))return;
    let due=addDays(l.ref==='F'?effEnd(ev):ev.start,l.off);if(due<T)due=T;
    save('tasks',{id:newId(),num:n++,title:`${l.title} · ${ev.title}`,projectId:ev.projectId||'',eventId:ev.id,tplKey:key,status:'todo',priority:l.prio,start:'',due,desc:'',tags:['rétroplanning'],blockedBy:[],checklist:[],comments:[{id:newId(),sys:true,text:'Créée par le rétroplanning',at:Date.now()}],createdAt:Date.now()+made});
    made++;
  });
  return made;
}

function calGrid(compact,pf){
  const inP=pf===undefined?inProj:(x=>pf==='all'||(x.projectId||'')===pf);
  const m=parse(ui.cal),y=m.getFullYear(),mo=m.getMonth();
  const off=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),weeks=Math.ceil((off+dim)/7);
  const T=today(),max=compact?3:4;
  const tasks=list('tasks').filter(t=>t.due&&inP(t)),evs=list('events').filter(inP);
  let h='';['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(d=>h+=`<div class="dow">${d}</div>`);
  for(let i=0;i<weeks*7;i++){
    const d=new Date(y,mo,1-off+i),ds=iso(d),out=d.getMonth()!==mo;
    const de=segsOn(evs,ds).sort((a,b)=>(isOp(a.e)?0:1)-(isOp(b.e)?0:1)||a.ext-b.ext||a.start.localeCompare(b.start));
    const dt=tasks.filter(t=>t.due===ds).sort((a,b)=>(a.status==='done')-(b.status==='done')||PRANK[a.priority]-PRANK[b.priority]);
    const info=dayInfo(ds),wk=i%7===0&&calPrefs().weeks?`<span class="wk" title="Semaine ${isoWeek(d)}">S${isoWeek(d)}</span>`:'',fer=info.fer?`<span class="ferie-l" title="${esc(info.fer)}">Férié</span>`:'';
    const ml=mailsOn(evs,ds),mb=ml.length?`<span class="mails">${ml.slice(0,4).map(mailBadge).join('')}</span>`:'';
    if(compact){
      const key=de.filter(x=>isOp(x.e)||(x.e.type==='deadline'&&x.start===ds));
      const nt=dt.filter(t=>t.status!=='done');
      const lateDay=nt.length&&ds<T;
      const chipsC=key.slice(0,2).map(x=>{const e=x.e,first=x.start===ds||i%7===0;return `<button class="chip ${isOp(e)?'ev '+(x.ext?'ext':'op'):'evs'}" style="--pc:${esc(e.type==='deadline'?'var(--danger)':evColor(e))}" data-act="open-event" data-id="${e.id}" title="${esc(segTitle(x))}">${first?esc(segTitle(x)):'&nbsp;'}</button>`;}).join('')+(key.length>2?`<span class="more">+${key.length-2}</span>`:'');
      h+=`<div class="cell ${out?'out':''} ${i%7>=5?'wknd':''} ${ds===T?'today':''} ${info.fer?'ferie':''}" data-act="day" data-date="${ds}"><span class="dhead2">${wk}<span class="dn">${d.getDate()}</span>${fer}${nt.length?`<span class="tcount ${lateDay?'late':''}" title="${nt.length} tâche${nt.length>1?'s':''} à rendre${lateDay?' (en retard)':''}">${nt.length}<small> tâche${nt.length>1?'s':''}</small></span>`:''}<span class="sp"></span>${mb}</span>${chipsC}${vacHTML(info)}</div>`;
      continue;
    }
    const items=[
      ...de.filter(x=>isOp(x.e)||x.start===ds).map(x=>{const e=x.e,first=x.start===ds||i%7===0;const tm=x.ext?'':evTime(e);
        if(!isOp(e)){const multi=x.end!==x.start;return `<button class="chip evs" style="--pc:${esc(e.type==='deadline'?'var(--danger)':evColor(e))}" data-act="open-event" data-id="${e.id}" title="${esc(e.title+' · '+(multi?dDay(x.start)+' → '+dDay(x.end):dShort(x.start))+(tm?' · '+tm:''))}">${esc((tm?tm.slice(0,5)+' ':'')+evIcon(e)+e.title)}${multi?` <span class="due">→ ${dDay(x.end)}</span>`:''}</button>`;}
        return `<button class="chip ev ${x.ext?'ext':isOp(e)?'op':''}" style="--pc:${esc(evColor(e))}" data-act="open-event" data-id="${e.id}" title="${esc(segTitle(x)+' · '+(x.start===x.end?dShort(x.start):dDay(x.start)+' → '+dDay(x.end)))}">${first?esc((tm?tm.slice(0,5)+' ':'')+segTitle(x)):'&nbsp;'}</button>`;}),
      ...dt.map(t=>`<button class="chip tk ${t.status==='done'?'done':''} ${t.status!=='done'&&ds<T?'late':''}" style="--dc:${pr(t.priority).c}" data-act="open-task" data-id="${t.id}" title="${esc(tkey(t)+' · '+t.title)}">${esc(t.title)}</button>`)
    ];
    h+=`<div class="cell ${out?'out':''} ${i%7>=5?'wknd':''} ${ds===T?'today':''} ${info.fer?'ferie':''}" data-act="day" data-date="${ds}"><span class="dhead2">${wk}<span class="dn">${d.getDate()}</span>${info.fer?`<span class="ferie-l" title="${esc(info.fer)}">${esc(info.fer)}</span>`:''}<span class="sp"></span>${mb}</span>${items.slice(0,max).join('')}${items.length>max?`<span class="more">+${items.length-max}</span>`:''}${vacHTML(info)}</div>`;
  }
  return `<div class="cal ${compact?'compact':'big'}">${h}</div>`;
}

function weekHTML(){
  const T=today(),open=openTasks();

  let h='';
  if(late.length)h+=`<div class="wday late"><h4>En retard</h4>${late.slice(0,4).map(t=>miniRow(t,true)).join('')}${late.length>4?`<button class="link more-link" data-act="kpi" data-k="late">+ ${late.length-4} autres en retard</button>`:''}</div>`;

  for(let i=0;i<7;i++){
    const ds=addDays(T,i);

    const ms=mailsOn(evs,ds);
    const ts=open.filter(t=>t.due===ds).sort((a,b)=>PRANK[a.priority]-PRANK[b.priority]);

const remDoc=()=>S.meta.reminders||{id:'reminders',items:[]};
const remItems=()=>Array.isArray(remDoc().items)?remDoc().items:[];
function saveRem(items){save('meta',{...remDoc(),id:'reminders',items});}
function autoReminders(){
  const T=today(),tm=addDays(T,1),out=[];
  list('events').forEach(e=>{
    (Array.isArray(e.mails)?e.mails:[]).forEach(m=>{if(m.date===T&&!m.sent)out.push({k:'mail',e,m,sort:'1'+(m.time||'99')});});
    if(isOp(e)){
      (Array.isArray(e.checklist)?e.checklist:[]).forEach(c=>{if(!c.done&&c.date&&c.date<=T)out.push({k:'cl',e,c,late:c.date<T,sort:'2'+c.date});});
      if(e.start===T)out.push({k:'opstart',e,sort:'0'});
      else if(e.start===tm)out.push({k:'opsoon',e,sort:'3'});
      if(effEnd(e)===T&&e.start!==T)out.push({k:'opend',e,sort:'0'});
    }
  });
  openTasks().forEach(t=>{if(t.waitingFor&&t.waitingSince&&diff(t.waitingSince,T)>=3)out.push({k:'relance',t,n:diff(t.waitingSince,T),sort:'4'});});
  return out.sort((a,b)=>a.sort.localeCompare(b.sort));
}

function projStats(p){
  const ts=list('tasks').filter(t=>t.projectId===p.id),done=ts.filter(t=>t.status==='done').length,T=today();
  const late=ts.filter(t=>t.status!=='done'&&t.due&&t.due<T).length;
  const next=ts.filter(t=>t.status!=='done'&&t.due).sort((a,b)=>a.due.localeCompare(b.due))[0];
  const ops=list('events').filter(e=>e.projectId===p.id&&isOp(e)&&evEnd(e)>=T).length;
  return {total:ts.length,done,open:ts.length-done,late,next,ops,pct:ts.length?Math.round(done/ts.length*100):0};
}
function progRow(p){

/* ---- liste (table éditable) ---- */
function filtered({ignoreStatus=false}={}){
  const f=ui.f,T=today(),q=norm(f.q);
  return list('tasks').filter(t=>{
    if(!inProj(t))return false;
    if(!ignoreStatus){if(f.status==='open'&&t.status==='done')return false;if(!['open','all'].includes(f.status)&&t.status!==f.status)return false;}
    if(f.priority==='high'&&PRANK[t.priority]>1)return false;
    if(!['all','high'].includes(f.priority)&&t.priority!==f.priority)return false;
    if(f.when==='late'&&!(t.due&&t.due<T&&t.status!=='done'))return false;
    if(f.when==='week'&&!(t.due&&t.due>=T&&t.due<=addDays(T,7)))return false;
    if(f.when==='week7late'&&!(t.due&&t.due<=addDays(T,7)))return false;
    if(f.when==='nodue'&&t.due)return false;
    if(f.when==='blocked'&&!(isBlocked(t)||(t.waitingFor&&t.status!=='done')))return false;
    if(f.when==='op'&&!t.eventId)return false;
    if(q){const p=S.projects[t.projectId],e=S.events[t.eventId];if(!norm([t.title,t.desc,tkey(t),p&&p.name,e&&e.title,t.waitingFor,(t.tags||[]).join(' ')].join(' ')).includes(q))return false;}
    return true;
  });
}
function sortTasks(a){
  const s=ui.f.sort;
  return a.sort((x,y)=>s==='prio'?PRANK[x.priority]-PRANK[y.priority]||(x.due||'9').localeCompare(y.due||'9'):s==='recent'?(y.createdAt||0)-(x.createdAt||0):(x.due||'9').localeCompare(y.due||'9')||PRANK[x.priority]-PRANK[y.priority]);
}
function tableRow(t){

function searchEvents(q){q=norm(q);if(!q)return [];return list('events').filter(e=>{const p=S.projects[e.projectId];return norm([e.title,e.code,e.conditions,e.notes,p&&p.name,et(e.type).l].join(' ')).includes(q);}).sort((a,b)=>b.start.localeCompare(a.start));}

    <label class="sr" for="flt-prio">Priorité</label><select id="flt-prio" data-filter="priority">${opt('all','Toutes priorités',f.priority)}${opt('high','Urgentes',f.priority)}${PRIOS.map(p=>opt(p.k,p.l,f.priority)).join('')}</select>
    <label class="sr" for="flt-when">Échéance</label><select id="flt-when" data-filter="when">${opt('all','Toutes échéances',f.when)}${opt('late','En retard',f.when)}${opt('week','7 prochains jours',f.when)}${opt('week7late','Retards + 7 jours',f.when)}${opt('nodue','Sans échéance',f.when)}${opt('blocked','Bloquées ou en attente',f.when)}${opt('op','Liées à une OP',f.when)}</select>
    <label class="sr" for="flt-group">Grouper</label><select id="flt-group" data-filter="group">${opt('none','Sans regroupement',f.group)}${opt('project','Grouper par projet',f.group)}${opt('status','Grouper par statut',f.group)}${opt('op','Grouper par OP',f.group)}</select>
    <label class="sr" for="flt-sort">Trier</label><select id="flt-sort" data-filter="sort">${opt('due','Tri : échéance',f.sort)}${opt('prio','Tri : priorité',f.sort)}${opt('recent','Tri : plus récentes',f.sort)}</select>
    ${active?`<button class="chipbtn" data-act="reset-filters">Réinitialiser</button>`:''}
    ${(()=>{const nd=filtered({ignoreStatus:true}).filter(t=>t.status==='done').length;return nd?`<button class="chipbtn" data-act="del-done">Supprimer les terminées (${nd})</button>`:'';})()}
    <span class="count">${rows.length} tâche${rows.length>1?'s':''}</span>
  </div>
  ${evHits.length?`<div class="section-h" style="margin-top:4px"><h2 style="font-size:16px">OP & événements</h2><small>${evHits.length} résultat${evHits.length>1?'s':''}</small></div><div class="evlist" style="margin-bottom:16px">${evHits.slice(0,8).map(e=>`<div class="evrow" data-act="open-event" data-id="${e.id}" tabindex="0" role="button" style="--pc:${esc(evColor(e))}"><span class="sw"></span><span class="dt">${evRange(e)}</span><span class="t">${evIcon(e)}${esc(e.title)} <span class="etype t-${esc(e.type)}">${esc(et(e.type).l)}</span>${e.code?`<span class="code-chip light">${esc(e.code)}</span>`:''}</span><span class="side-meta">${projChip(e.projectId)}</span></div>`).join('')}</div>`:''}

/* ---- chronologie (Gantt) ---- */
function viewTimeline(){
  const W=34,N=56,start=ui.tl,end=addDays(start,N-1),T=today();
  const x=ds=>diff(start,ds)*W;
  const clipBar=(s,e)=>{if(e<start||s>end)return null;const a=s<start?start:s,b=e>end?end:e;return {left:x(a),width:(diff(a,b)+1)*W-4};};
  let months='',cur=null,cw=0;
  for(let i=0;i<N;i++){const ds=addDays(start,i),mk=ds.slice(0,7);if(mk!==cur){if(cur)months+=`<div style="width:${cw*W}px">${fMonth.format(parse(cur+'-01'))}</div>`;cur=mk;cw=0;}cw++;}
  months+=`<div style="width:${cw*W}px">${fMonth.format(parse(cur+'-01'))}</div>`;
  let days='';for(let i=0;i<N;i++){const ds=addDays(start,i),d=parse(ds);days+=`<div style="width:${W}px" class="${ds===T?'today':''} ${d.getDay()===1?'mon':''}">${d.getDate()}</div>`;}
  const bg=`background-image:repeating-linear-gradient(to right,transparent 0 ${5*W}px,var(--wk) ${5*W}px ${7*W}px),repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px ${W}px);width:${N*W}px`;
  const row=(label,track,cls='')=>`<div class="tl-row ${cls}">${label}<div class="tl-track" style="${bg}">${track}</div></div>`;
  let rows='';
  // OP & événements en couloirs
  const evs=list('events').filter(e=>inProj(e)&&isOp(e)).flatMap(segs).filter(x=>x.end>=start&&x.start<=end).sort((a,b)=>a.start.localeCompare(b.start));
  const others=list('events').filter(e=>inProj(e)&&!isOp(e)&&e.start>=start&&e.start<=end);
  const lanes=[];evs.forEach(x=>{let l=lanes.findIndex(le=>le<x.start);if(l<0){lanes.push('');l=lanes.length-1;}lanes[l]=x.end;x._lane=l;});
  rows+=row(`<div class="tl-label group">OP commerciales</div>`,'','group');
  for(let l=0;l<Math.max(1,lanes.length);l++){
    const bars=evs.filter(x=>x._lane===l).map(x=>{const e=x.e,c=clipBar(x.start,x.end);return c?`<button class="tl-bar ${x.ext?'ext':''}" style="--pc:${esc(evColor(e))};left:${c.left+2}px;width:${Math.max(c.width,W-4)}px" data-act="open-event" data-id="${e.id}" title="${esc(segTitle(x)+' · '+dDay(x.start)+' → '+dDay(x.end))}">${esc(segTitle(x))}</button>`:'';}).join('');
    rows+=row(`<div class="tl-label" style="cursor:default;color:var(--muted)">${l===0&&!evs.length?'Aucune OP sur la période':''}</div>`,bars);
  }
  if(others.length)rows+=row(`<div class="tl-label" style="cursor:default;color:var(--muted)">Autres événements</div>`,others.map(e=>`<button class="tl-dot" style="--pc:${esc(e.type==='deadline'?'var(--danger)':evColor(e))};left:${x(e.start)+W/2-5}px" data-act="open-event" data-id="${e.id}" title="${esc(et(e.type).l+' · '+e.title+' · '+evRange(e)+(evTime(e)?' · '+evTime(e):''))}" aria-label="${esc(e.title)}"></button>`).join(''));
  // tâches par projet
  const groups=[...projSorted().filter(p=>inProj({projectId:p.id})).map(p=>({id:p.id,name:p.name,color:p.color})),...(inProj({projectId:''})?[{id:'',name:'Sans projet',color:'#9aa0b2'}]:[])];
  let hidden=0;
  groups.forEach(g=>{
    const ts=list('tasks').filter(t=>(t.projectId||'')===g.id);
    const vis=ts.filter(t=>t.due).filter(t=>{const s=t.start&&t.start<=t.due?t.start:t.due;return t.due>=start&&s<=end;}).sort((a,b)=>(a.start||a.due).localeCompare(b.start||b.due));
    hidden+=ts.filter(t=>!t.due&&t.status!=='done').length;
    if(!vis.length)return;
    rows+=row(`<div class="tl-label group"><span class="pchip" style="--pc:${esc(g.color)};color:var(--ink);font-size:14px">${esc(g.name)}</span></div>`,'','group');
    vis.forEach(t=>{
      const s=t.start&&t.start<=t.due?t.start:t.due,c=clipBar(s,t.due),ms=!t.start||t.start===t.due;
      const late=t.status!=='done'&&t.due<T;
      rows+=row(`<div class="tl-label" data-act="open-task" data-id="${t.id}" tabindex="0" role="button"><span class="tid">${tkey(t)}</span><span class="t">${esc(t.title)}</span></div>`,
        c?`<button class="tl-bar task ${ms?'ms':''} ${t.status==='done'?'done':''} ${late?'late':''}" style="--pc:${esc(g.color)};left:${c.left+(ms?(W-16)/2:2)}px;width:${c.width}px" data-act="open-task" data-id="${t.id}" title="${esc(tkey(t)+' · '+t.title+' · '+(t.start&&!ms?dDay(t.start)+' → ':'')+dDay(t.due))}" aria-label="${esc(t.title)}">${ms?'':esc(t.title)}</button>`:'');
    });
  });
  const todayLine=T>=start&&T<=end?`<div class="tl-today" style="left:${240+x(T)+W/2}px"></div>`:'';
  return `<div class="cal-head"><h2 style="min-width:0">${dDay(start)} → ${dDay(end)}</h2>
    <button class="btn sm" data-act="tl-prev" aria-label="Deux semaines plus tôt">←</button><button class="btn sm" data-act="tl-today">Aujourd’hui</button><button class="btn sm" data-act="tl-next" aria-label="Deux semaines plus tard">→</button>
    <span class="spacer"></span>${projectFilterSelect()}</div>
  <div class="tl-wrap"><div class="tl">
    <div class="tl-head"><div class="tl-row"><div class="tl-label">Période</div><div><div class="tl-months">${months}</div><div class="tl-days">${days}</div></div></div></div>
    ${rows}${todayLine}
  </div></div>
  <div class="legend"><span>Barre : tâche avec date de début et échéance</span><span>Losange : tâche avec échéance seule</span><span>Contour rouge : en retard</span>${hidden?`<span>${hidden} tâche(s) ouvertes sans échéance non affichées</span>`:''}</div>`;
}

const mroot=$('#modal-root'),droot=$('#drawer-root');
let lastFocus=null,confirmResolve=null;
function openModal({title,body,foot,size=''}){
  if(mroot.hidden)lastFocus=document.activeElement;
  mroot.innerHTML=`<div class="backdrop" data-close></div><div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="m-title"><header><h2 id="m-title">${title}</h2><button class="icon-btn" data-close aria-label="Fermer">×</button></header><div class="m-body">${body}</div><footer>${foot}</footer></div>`;
  mroot.hidden=false;
  setTimeout(()=>{const el=mroot.querySelector('.m-body input:not([type=radio]):not([type=checkbox]):not([type=file]),.m-body select,.m-body textarea,footer .btn.primary');el&&el.focus();},30);
}
function hideModal(){mroot.hidden=true;mroot.innerHTML='';}
function closeModal(){hideModal();if(confirmResolve){const r=confirmResolve;confirmResolve=null;r(false);}if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
function confirmBox(title,text,ok='Supprimer'){
  return new Promise(res=>{
    const prevFocus=document.activeElement;
    openModal({size:'small',title:esc(title),body:`<p style="margin:0;color:var(--muted)">${esc(text)}</p>`,foot:`<span class="spacer"></span><button class="btn ghost" data-close>Annuler</button><button class="btn primary" id="cf-ok" style="background:var(--danger);border-color:var(--danger);color:#fff">${esc(ok)}</button>`});
    lastFocus=prevFocus;confirmResolve=res;
    $('#cf-ok').onclick=()=>{confirmResolve=null;hideModal();res(true);};
  });
}

/* --- panneau tâche (façon Wrike) --- */
let drawer=null;
function openTask(id,preset={}){
  const ex=id&&S.tasks[id];
  const dp=preset.projectId??(preset.eventId&&S.events[preset.eventId]?S.events[preset.eventId].projectId:(ui.f.project!=='all'&&ui.f.project!=='none'?ui.f.project:''));
  const t=ex?clone(ex):{id:newId(),num:nextNum(),title:'',desc:'',projectId:dp||'',status:preset.status||'todo',priority:'normal',start:'',due:preset.due||'',eventId:preset.eventId||'',tags:[],blockedBy:[],checklist:[],comments:[],createdAt:Date.now()};
  ['tags','blockedBy','checklist','comments'].forEach(k=>{if(!Array.isArray(t[k]))t[k]=[];});
  if(droot.hidden)drawer={t,isNew:!ex,ret:document.activeElement};else drawer={...drawer,t,isNew:!ex};
  renderDrawer(true);
}
function commitDrawer(){
  if(!drawer)return;const t=drawer.t;
  if(!t.title.trim())return;
  const first=drawer.isNew;drawer.isNew=false;
  save('tasks',t);
  if(first)toast(`${tkey(t)} créée`);
}
function closeDrawer(){
  if(!drawer)return;
  const t=drawer.t;
  const ta=$('#d-title');if(ta)t.title=ta.value.trim();const de=$('#d-desc');if(de)t.desc=de.value;
  if(t.title&&(drawer.isNew||JSON.stringify({...t,updatedAt:0})!==JSON.stringify({...(S.tasks[t.id]||{}),updatedAt:0})))commitDrawer();
  const ret=drawer.ret;drawer=null;droot.hidden=true;droot.innerHTML='';
  if(ret&&document.contains(ret))ret.focus();
}
function renderDrawer(focusTitle){

  const depOpts=`<option value="">+ Ajouter une tâche bloquante…</option>`+openTasks().filter(x=>x.id!==t.id&&!t.blockedBy.includes(x.id)).sort((a,b)=>(a.num||0)-(b.num||0)).map(x=>`<option value="${x.id}">${esc(tkey(x)+' · '+x.title)}</option>`).join('');
  const blocking=list('tasks').filter(x=>(x.blockedBy||[]).includes(t.id));
  const late=t.status!=='done'&&t.due&&t.due<T;
  droot.innerHTML=`<div class="backdrop" data-close-drawer></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Détail de la tâche">
    <div class="dr-top"><span class="tid" style="font-size:13px">${tkey(t)}</span>
      <label class="sr" for="d-project">Projet</label><select id="d-project" data-df="projectId">${projectOptions(t.projectId)}</select>
      <span class="spacer"></span>${drawer.isNew?'':'<button class="btn sm danger-ghost" id="d-del">Supprimer</button>'}<button class="icon-btn" data-close-drawer aria-label="Fermer">×</button></div>
    <div class="dr-body">
      <div><label class="sr" for="d-title">Titre</label><textarea id="d-title" class="dr-title" rows="1" placeholder="Titre de la tâche (Entrée pour créer)">${esc(t.title)}</textarea>
      ${drawer.isNew?'<p class="hint">Saisis un titre puis appuie sur Entrée : la tâche est créée et chaque modification est enregistrée automatiquement.</p>':''}</div>
      <div class="dr-fields">
        <label for="d-status">Statut</label><select id="d-status" data-df="status" class="st-${t.status}" style="font-weight:600">${STATUSES.map(s=>opt(s.k,s.l,t.status)).join('')}</select>
        <label for="d-prio">Priorité</label><select id="d-prio" data-df="priority" class="prio-${t.priority}" style="font-weight:600">${PRIOS.map(p=>opt(p.k,p.l,t.priority)).join('')}</select>
        <span class="k">Dates</span><span class="dates"><label class="sr" for="d-start">Début</label><input type="date" id="d-start" data-df="start" value="${esc(t.start||'')}" title="Début"><span class="due">→</span><label class="sr" for="d-due">Échéance</label><input type="date" id="d-due" data-df="due" value="${esc(t.due||'')}" title="Échéance">${t.due?`<span class="due ${late?'late':''}">${t.status==='done'?'':rel(t.due)}</span>`:''}</span>
        <label for="d-recur">Récurrence</label><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="d-recur" data-df="recur">${opt('','Aucune',t.recur||'')}${Object.entries(RECUR).map(([k,l])=>opt(k,l,t.recur||'')).join('')}</select>${t.recur?`<span class="hint">À la fin, la suivante est créée toute seule${t.due?' pour le '+dShort(nextOccur(t.due,t.recur)):''}</span>`:''}</span>
        <label for="d-event">OP liée</label><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="d-event" data-df="eventId">${evOpts}</select>${t.projectId&&!list('events').some(e=>isOp(e)&&(e.projectId||'')===t.projectId)?`<span class="hint">Aucune OP dans ce projet</span>`:''}</span>
        <label for="d-tags">Étiquettes</label><input id="d-tags" data-df="tags" value="${esc(t.tags.join(', '))}" placeholder="ex. mailing, seo">
        <span class="k">Bloquée par</span><span class="deps">${t.blockedBy.map(id=>{const b=S.tasks[id];return b?`<span class="dep ${b.status==='done'?'ok':''}">${esc(tkey(b)+' · '+b.title)}<button data-dep-del="${id}" aria-label="Retirer la dépendance">×</button></span>`:'';}).join('')}<label class="sr" for="d-dep">Ajouter une dépendance</label><select id="d-dep" style="max-width:260px">${depOpts}</select></span>
        <label for="d-wait">En attente de</label><span class="wait-f"><input id="d-wait" data-df="waitingFor" list="d-wait-list" maxlength="120" value="${esc(t.waitingFor||'')}" placeholder="Personne ou chose (ex. validation de la direction, visuels de l’agence)"><datalist id="d-wait-list">${[...new Set(list('tasks').map(x=>x.waitingFor).filter(Boolean))].slice(0,30).map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>${t.waitingFor&&t.waitingSince?`<span class="due ${diff(t.waitingSince,T)>=3?'soon':''}">${diff(t.waitingSince,T)<=0?'depuis aujourd’hui':'depuis '+diff(t.waitingSince,T)+' j'}</span>`:''}</span>
        ${blocking.length?`<span class="k">Bloque</span><span class="deps">${blocking.map(b=>`<span class="dep">${esc(tkey(b)+' · '+b.title)}</span>`).join('')}</span>`:''}
      </div>
      <div class="dr-sec"><h4><label for="d-desc">Description</label></h4><textarea id="d-desc" placeholder="Contexte, liens, interlocuteurs…">${esc(t.desc||'')}</textarea></div>

        <ul class="checklist">${t.checklist.map((c,i)=>`<li class="${c.done?'done':''}"><button class="check ${c.done?'on':''}" data-cl-toggle="${i}" aria-label="${c.done?'Décocher':'Cocher'} ${esc(c.text)}">${c.done?CHECK_SVG:''}</button><span>${esc(c.text)}</span><button class="icon-btn" data-cl-del="${i}" aria-label="Retirer ${esc(c.text)}">×</button></li>`).join('')}</ul>

      <div class="dr-sec"><h4>Activité</h4>
        <div class="add-line"><label class="sr" for="d-com">Commentaire</label><input id="d-com" placeholder="Ajouter un commentaire ou une note de suivi"><button class="btn" id="d-com-add">Publier</button></div>
        <div class="activity">${t.comments.slice().reverse().map(c=>c.sys?`<div class="act sys"><time>${esc(new Date(c.at).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</time><span>${esc(c.text)}</span></div>`:`<div class="act"><time>${esc(new Date(c.at).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</time><p>${esc(c.text)}</p></div>`).join('')}
        ${drawer.isNew?'':`<div class="act sys"><time>${esc(new Date(t.createdAt||Date.now()).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</time><span>Tâche créée</span></div>`}</div></div>
    </div>
  </aside>`;
  droot.hidden=false;
  const ta=$('#d-title');const fit=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';};fit();
  ta.addEventListener('input',()=>{drawer.t.title=ta.value.replace(/\n/g,' ');fit();});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();drawer.t.title=ta.value.trim();if(drawer.t.title){commitDrawer();renderDrawer();}}});
  ta.addEventListener('blur',()=>{const v=ta.value.trim();if(drawer&&v&&v!==(S.tasks[drawer.t.id]||{}).title){drawer.t.title=v;commitDrawer();}});
  const de=$('#d-desc');de.addEventListener('change',()=>{drawer.t.desc=de.value;commitDrawer();});
  if(focusTitle&&drawer.isNew)setTimeout(()=>ta.focus(),30);
  else if(active&&$('#'+active))$('#'+active).focus();
}
function drawerField(el){
  const t=drawer.t,k=el.dataset.df,v=el.value;
  if(k==='status'){drawer.t=withStatus(t,v);}
  else if(k==='waitingFor'){
    const old=t.waitingFor||'',nv=v.trim();
    if(nv!==old){
      t.waitingFor=nv;t.waitingSince=nv?today():'';
      t.comments=(t.comments||[]).concat({id:newId(),sys:true,text:nv?`En attente de : ${nv}`:`Plus en attente de : ${old}`,at:Date.now()}).slice(-120);
      if(nv&&['todo','doing','review'].includes(t.status)){drawer.t=withStatus(t,'waiting');}
    }
  }
  else if(k==='tags')t.tags=v.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean).slice(0,10);
  else if(k==='start'){t.start=v;if(v&&t.due&&t.due<v)t.due=v;}
  else if(k==='due'){t.due=v;if(v&&t.start&&t.start>v)t.start=v;}
  else if(k==='eventId'){t.eventId=v;if(v&&!t.projectId&&S.events[v])t.projectId=S.events[v].projectId||'';}
  else if(k==='projectId'){t.projectId=v;const ev=S.events[t.eventId];if(v&&ev&&(ev.projectId||'')!==v){t.eventId='';toast('OP liée retirée : elle appartient à un autre projet');}}
  else t[k]=v;
  commitDrawer();renderDrawer();
}
function drawerClick(e){
  const t=drawer.t;
  const tg=e.target.closest('[data-cl-toggle]');if(tg){t.checklist[+tg.dataset.clToggle].done=!t.checklist[+tg.dataset.clToggle].done;commitDrawer();renderDrawer();return true;}
  const dl=e.target.closest('[data-cl-del]');if(dl){t.checklist.splice(+dl.dataset.clDel,1);commitDrawer();renderDrawer();return true;}
  const dd=e.target.closest('[data-dep-del]');if(dd){t.blockedBy=t.blockedBy.filter(x=>x!==dd.dataset.depDel);commitDrawer();renderDrawer();return true;}
  if(e.target.closest('#d-cl-add')){addCl();return true;}
  if(e.target.closest('#d-com-add')){addCom();return true;}
  if(e.target.closest('#d-del')){confirmBox('Supprimer la tâche ?',`${tkey(t)} « ${t.title} » sera supprimée définitivement.`).then(ok=>{if(ok){removeItem('tasks',t.id);list('tasks').filter(x=>(x.blockedBy||[]).includes(t.id)).forEach(x=>save('tasks',{...x,blockedBy:x.blockedBy.filter(y=>y!==t.id)}));drawer.isNew=true;drawer.t.title='';closeDrawer();toast('Tâche supprimée');}});return true;}
  return false;
}
function addCl(){const i=$('#d-cl'),v=i.value.trim();if(!v)return;drawer.t.checklist.push({id:newId(),text:v,done:false});commitDrawer();renderDrawer();$('#d-cl').focus();}
function addCom(){const i=$('#d-com'),v=i.value.trim();if(!v)return;drawer.t.comments.push({id:newId(),text:v,at:Date.now()});drawer.t.comments=drawer.t.comments.slice(-120);commitDrawer();renderDrawer();}

/* ---------- import du calendrier d'OP ---------- */
const MONTHS={janvier:1,janv:1,jan:1,fevrier:2,fevr:2,fev:2,feb:2,mars:3,mar:3,avril:4,avr:4,apr:4,mai:5,may:5,juin:6,jun:6,juillet:7,juil:7,jul:7,aout:8,aug:8,septembre:9,sept:9,sep:9,octobre:10,oct:10,novembre:11,nov:11,decembre:12,dec:12};
function mkDate(y,m,d){if(!(m>=1&&m<=12&&d>=1&&d<=31&&y>1990&&y<2100))return null;const dt=new Date(y,m-1,d);return dt.getMonth()===m-1?iso(dt):null;}
function guessYear(m){const n=new Date(),y=n.getFullYear();return m<n.getMonth()+1-3?y+1:y;}
function parseDateAny(v,yearHint){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return iso(v);
  if(typeof v==='number'){if(v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;}return null;}
  let s=norm(v).replace(/^(du|le|a partir du)\s+/,'').replace(/^(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|lun|mar|mer|jeu|ven|sam|dim)\.?\s+/,'');
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return mkDate(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?(?:\s.*)?$/);
  if(m){const y=m[3]?(m[3].length===2?2000+(+m[3]):+m[3]):(yearHint||guessYear(+m[2]));return mkDate(y,+m[2],+m[1]);}
  m=s.match(/^(\d{1,2})(?:er)?\s+([a-z]+)\.?(?:\s+(\d{4}))?/);

function detectTable(rows){

const MONTHS_STRICT={janvier:1,janv:1,fevrier:2,fevr:2,fev:2,mars:3,avril:4,avr:4,mai:5,juin:6,juillet:7,juil:7,aout:8,septembre:9,sept:9,octobre:10,oct:10,novembre:11,nov:11,decembre:12,dec:12,january:1,february:2,march:3,april:4,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
function monthFrom(v){
  if(typeof v==='number'&&v>20000){const d=parseDateAny(v);return d?{m:+d.slice(5,7),y:+d.slice(0,4)}:null;}
  const s=norm(cellText(v));if(!s)return null;

function detectGrid(rows){

    const cd={};let n=0;
    (rows[r]||[]).forEach((v,c)=>{if(cellText(v)==='')return;if(typeof v==='number'&&v<20000)return;const d=parseDateAny(v);if(d){cd[c]=d;n++;}});
    if(n>=5&&(!best||n>best.n))best={r,cd,n};
  }

    for(let r=1;r<R;r++){
      const row=rows[r]||[];const cd={};let n=0;
      const carried=[];for(let k=1;k<=3&&r-k>=0;k++){let cur=null;const arr=[];const up=rows[r-k]||[];for(let c=0;c<Math.max(up.length,row.length);c++){const mo=monthFrom(up[c]);if(mo)cur=mo;arr[c]=cur;}carried.push(arr);}

async function clearSamples(){

  const sp=new Set(list('projects').filter(p=>p.sample).map(p=>p.id)),se=new Set(list('events').filter(e=>e.sample).map(e=>e.id));
  ['projects','tasks','events'].forEach(c=>list(c).filter(x=>x.sample).forEach(x=>removeItem(c,x.id)));
  list('tasks').filter(t=>!t.sample&&(sp.has(t.projectId)||se.has(t.eventId))).forEach(t=>save('tasks',{...t,projectId:sp.has(t.projectId)?'':t.projectId,eventId:se.has(t.eventId)?'':t.eventId}));
  list('events').filter(e=>!e.sample&&sp.has(e.projectId)).forEach(e=>save('events',{...e,projectId:''}));

}

function go(view){if(location.hash!=='#'+view)location.hash=view;else{ui.view=view;schedule();}}

function deleteTasks(ts,msg){
  confirmBox(ts.length>1?'Supprimer ces tâches ?':'Supprimer la tâche ?',msg).then(ok=>{if(!ok)return;const ids=new Set(ts.map(t=>t.id));
    ts.forEach(t=>removeItem('tasks',t.id));
    list('tasks').filter(x=>!ids.has(x.id)&&(x.blockedBy||[]).some(b=>ids.has(b))).forEach(x=>save('tasks',{...x,blockedBy:x.blockedBy.filter(b=>!ids.has(b))}));
    if(drawer&&ids.has(drawer.t.id)){drawer=null;droot.hidden=true;droot.innerHTML='';}
    toast(ts.length>1?`${ts.length} tâches supprimées`:'Tâche supprimée');});

document.addEventListener('click',e=>{

  const a=e.target.closest('[data-act]');if(!a)return;
  const id=a.dataset.id,inModal=mroot.contains(a);
  switch(a.dataset.act){
    case 'toggle-done':e.stopPropagation();toggleDone(id);if(inModal){hideModal();}if(drawer&&!droot.hidden&&!droot.contains(a)&&drawer.t.id===id)openTask(id);break;
    case 'open-task':if(inModal)hideModal();openTask(id);break;
    case 'new-task':if(inModal)hideModal();openTask(null,{due:a.dataset.due,status:a.dataset.status,projectId:a.dataset.project,eventId:a.dataset.event});break;
    case 'open-event':if(inModal)hideModal();if(drawer)closeDrawer();eventModal(id);break;
    case 'new-event':if(inModal)hideModal();if(drawer)closeDrawer();eventModal(null,{start:a.dataset.start,type:a.dataset.type,projectId:a.dataset.project});break;
    case 'new-project':projectModal(null);break;
    case 'goto-rem':{const r=$('#rappels');r&&r.scrollIntoView({behavior:'smooth',block:'start'});break;}
    case 'rem-mail-sent':{const ev=S.events[id];if(ev){save('events',{...ev,mails:(ev.mails||[]).map(m=>m.id===a.dataset.mid?{...m,sent:true}:m)});toast('Envoi noté comme fait');}break;}
    case 'rem-cl':{const ev=S.events[id];if(ev){save('events',{...ev,checklist:(ev.checklist||[]).map(c=>c.id===a.dataset.cid?{...c,done:true}:c)});toast('Étape cochée');}break;}
    case 'rem-done':saveRem(remItems().map(r=>r.id===id?{...r,done:true}:r));toast('Rappel terminé');break;
    case 'rem-del':saveRem(remItems().filter(r=>r.id!==id));break;
    case 'del-task':{e.stopPropagation();const t=S.tasks[id];if(t)deleteTasks([t],`${tkey(t)} « ${t.title} » sera supprimée définitivement.`);break;}
    case 'del-done':{const ts=filtered({ignoreStatus:true}).filter(t=>t.status==='done');if(ts.length)deleteTasks(ts,`${ts.length} tâche(s) terminée(s) seront supprimées définitivement.`);break;}
    case 'edit-project':projectModal(id);break;
    case 'goto-project':resetF();ui.f.project=id;go('taches');schedule();break;
    case 'reset-filters':resetF();schedule();break;
    case 'day':dayModal(a.dataset.date);break;
    case 'import':if(drawer)closeDrawer();importModal();break;
    case 'settings':settingsModal();break;
    case 'kpi':{resetF();const k=a.dataset.k;
      if(k==='late')ui.f.when='late';else if(k==='week')ui.f.when='week';else if(k==='week7late')ui.f.when='week7late';
      else if(k==='urgent')ui.f.priority='high';else if(k==='doing')ui.f.status='doing';else if(k==='blocked')ui.f.when='blocked';
      go('taches');schedule();break;}
    case 'cal-prev':{const m=parse(ui.cal);ui.cal=iso(new Date(m.getFullYear(),m.getMonth()-1,1));schedule();break;}
    case 'cal-next':{const m=parse(ui.cal);ui.cal=iso(new Date(m.getFullYear(),m.getMonth()+1,1));schedule();break;}
    case 'cal-today':ui.cal=today().slice(0,8)+'01';schedule();break;
    case 'dcal':{const ids=dcalOrder();dcalGo(id,ids.indexOf(id)-ids.indexOf(ui.dcal));break;}
    case 'dcal-step':{const ids=dcalOrder(),d=+a.dataset.dir,i=(ids.indexOf(ui.dcal)+d+ids.length)%ids.length;dcalGo(ids[i],d);break;}
    case 'dcal-detail':ui.f.project=ui.dcal;go('calendrier');schedule();break;

document.addEventListener('keydown',e=>{
  const top=!mroot.hidden?mroot:!droot.hidden?droot:null;
  if(top){
    if(e.key==='Escape'){e.preventDefault();top===mroot?closeModal():closeDrawer();return;}
    if(e.key==='Tab'){const f=[...top.querySelectorAll('button,input,select,textarea,[tabindex],label.btn')].filter(x=>!x.disabled&&x.offsetParent!==null&&!x.classList.contains('sr'));if(f.length){const a=f[0],b=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus();}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus();}}}
    if(top===droot&&e.key==='Enter'){if(e.target.id==='d-cl'){e.preventDefault();addCl();return;}if(e.target.id==='d-com'){e.preventDefault();addCom();return;}}
    if(top===droot&&e.key==='Enter'&&e.target.dataset&&['tags','waitingFor'].includes(e.target.dataset.df)){e.preventDefault();e.target.blur();return;}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();}
    if(e.key==='Enter'&&e.target.matches('label.btn[for]')){e.preventDefault();e.target.click();}
    return;
  }
  const tag=(e.target.tagName||'').toLowerCase();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();return;}
  if(['input','textarea','select'].includes(tag)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='n'){e.preventDefault();openTask(null);}
  if(e.key==='e'){e.preventDefault();eventModal(null);}
  if(e.key==='/'){e.preventDefault();$('#q').focus();}
});

let swX=null,swY=null;
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#dcal-slide')){swX=e.touches[0].clientX;swY=e.touches[0].clientY;}else swX=null;},{passive:true});
document.addEventListener('touchend',e=>{if(swX==null)return;const dx=e.changedTouches[0].clientX-swX,dy=e.changedTouches[0].clientY-swY;swX=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){const ids=dcalOrder(),d=dx<0?1:-1,i=(ids.indexOf(ui.dcal)+d+ids.length)%ids.length;dcalGo(ids[i],d);}},{passive:true});
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;dragId=c.dataset.drag;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(x){}});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');c&&c.classList.remove('dragging');document.querySelectorAll('.kcol.over').forEach(x=>x.classList.remove('over'));dragId=null;});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.kcol.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over');});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(!col||!dragId)return;e.preventDefault();const t=S.tasks[dragId],s=col.dataset.status;if(t&&t.status!==s){save('tasks',withStatus(t,s));toast(`${tkey(t)} → ${st(s).l}`);}col.classList.remove('over');dragId=null;});

function route(){const h=location.hash.slice(1);ui.view=VIEWS[h]?h:'dashboard';schedule();}
window.addEventListener('hashchange',route);
route();init();
})();
</script>
</body>
</html>
